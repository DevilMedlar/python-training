name: Run Python lesson
run-name: Python lesson — ${{ github.ref_name }} — ${{ github.sha }}

on:
  push:
    paths:
      - 'workspace/**'
      - 'tools/run_lesson.py'
      - 'tools/run_tests.py'
      - '.github/workflows/learn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-lesson-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lesson:
    name: Python workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install lesson dependencies
        run: python -m pip install -r workspace/requirements.txt
      - name: Run program
        run: python tools/run_lesson.py
      - name: Learner tests
        shell: bash
        run: |
          if compgen -G 'workspace/test_*.py' > /dev/null; then
            python tools/run_tests.py --start workspace --pattern 'test_*.py'
          else
            echo 'No learner tests supplied yet. Testing begins in P1-10; this step does not claim your code was tested.'
          fi
